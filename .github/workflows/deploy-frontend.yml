name: 'Deploy Frontend & API'

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'api/**'
  workflow_dispatch:

jobs:
  build_and_deploy_job:

    # Only run this job if the repository is the expected one or if it's a manual dispatch 
    # If you cloned this repo and want automatic deployments, you must update this condition to match your repository name.
    if: github.repository == 'BrendenScott/Portfolio' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Build And Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (optional)
          action: "upload"
          app_location: "frontend"        # Path to your HTML/CSS/JS folder
          api_location: "api"             # Path to your Python Azure Functions folder
          output_location: ""             # Leave blank if pure HTML/JS (no heavy framework build step)