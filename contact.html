<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Portfolio Via Azure</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="dashboard-bg">

    <!-- THE PARTICLES BACKGROUND -->
    <div id="particles-js"></div>

    <main class="bento-dashboard">

        <!-- 1. BACK TO HOME -->
        <a href="./index.html" class="monitor-bezel monitor-featured">
            <div class="monitor-screen">
                <div class="glass-edge-bleed"></div>
                <div class="glass-imperfections"></div>
                <div class="glass-glare"></div>
                <div class="crt-cursor"></div> 
                <div class="shine"></div>
                <div class="line line-1"></div>
                
                <div class="screen-content" data-tilt data-tilt-max="10" data-tilt-speed="400" data-tilt-perspective="1000" data-tilt-scale="1.03">
                    <h2 class="terminal-text">< Home</h2>
                    <p class="screen-data">Return to Dashboard</p>
                </div>
            </div>
        </a>

        <!-- 2. EMAIL (Click to Copy) -->
        <!-- Added ID "email-monitor" for JavaScript targeting -->
        <div class="monitor-bezel monitor-featured" id="email-monitor">
            <div class="monitor-screen">
                <div class="glass-edge-bleed"></div>
                <div class="glass-imperfections"></div>
                <div class="glass-glare"></div>
                <div class="crt-cursor"></div> 
                <div class="shine"></div>
                <div class="line line-1"></div>
                
                <div class="screen-content" data-tilt data-tilt-max="10" data-tilt-speed="400" data-tilt-perspective="1000" data-tilt-scale="1.03">
                    <!-- Added IDs to text so we can swap them with JS -->
                    <h2 class="terminal-text" id="email-title">Email</h2>
                    <p class="screen-data" id="email-address">brenden.scott.it@outlook.com</p>
                </div>
            </div>
        </div>

        <!-- 3. LINKEDIN (Opens in new tab) -->
        <!-- target="_blank" opens the new tab, rel="noopener" is a security best practice -->
        <a href="https://www.linkedin.com/in/brenden-s/" target="_blank" rel="noopener noreferrer" class="monitor-bezel monitor-featured">
            <div class="monitor-screen">
                <div class="glass-edge-bleed"></div>
                <div class="glass-imperfections"></div>
                <div class="glass-glare"></div>
                <div class="crt-cursor"></div> 
                <div class="shine"></div>
                <div class="line line-1"></div>
                
                <div class="screen-content" data-tilt data-tilt-max="10" data-tilt-speed="400" data-tilt-perspective="1000" data-tilt-scale="1.03">
                    <h2 class="terminal-text">LinkedIn</h2>
                    <p class="screen-data">Connect with me professionally</p>
                </div>
            </div>
        </a>

        <!-- 4. GITHUB (Recommended addition!) -->
        <a href="https://github.com/BrendenScott" target="_blank" rel="noopener noreferrer" class="monitor-bezel monitor-featured">
            <div class="monitor-screen">
                <div class="glass-edge-bleed"></div>
                <div class="glass-imperfections"></div>
                <div class="glass-glare"></div>
                <div class="crt-cursor"></div> 
                <div class="shine"></div>
                <div class="line line-1"></div>
                
                <div class="screen-content" data-tilt data-tilt-max="10" data-tilt-speed="400" data-tilt-perspective="1000" data-tilt-scale="1.03">
                    <h2 class="terminal-text">GitHub</h2>
                    <p class="screen-data">View my code repositories</p>
                </div>
            </div>
        </a>

    </main>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.0/vanilla-tilt.min.js"></script>
    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script>
        particlesJS.load('particles-js', 'particles.json', function() {
            console.log('Particles config loaded successfully!');
        });
    </script>
</body>
</html>
