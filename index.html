<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Via Azure - Monitor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="dashboard-bg">

    <!-- The Modular Grid Wrapper -->
    <main class="bento-dashboard">

      <a href="./projects.html" class="monitor-bezel monitor-featured">
          <div class="monitor-screen" id="edgeGlowBox">

              <div class="glass-edge-bleed"></div>

              <!-- The hidden dust and smudges revealed by the mouse glow -->
              <div class="glass-imperfections"></div>

              <!-- The ambient room light reflecting off the glass -->
              <div class="glass-glare"></div>
              
              <!-- The Fake CRT Mouse Cursor -->
              <div class="crt-cursor"></div> 

              <!-- Your Tilting Content -->
              <div class="screen-content" data-tilt data-tilt-max="10" data-tilt-speed="400" data-tilt-perspective="1000" data-tilt-scale="1.03" data-tilt-mobile="false">
                  <h2 class="terminal-text">>_ PORTFOLIO VIA AZURE</h2>
                  <p class="screen-data">View Serverless CI/CD Architecture & IaC</p>
              </div>

          </div>
      </a>

    </main>

    <!-- Load Vanilla-Tilt.js first -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.0/vanilla-tilt.min.js"></script>
    
    <!-- Load your custom script -->
    <script src="script.js"></script>
</body>
</html>
